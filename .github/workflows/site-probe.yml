name: Site probe

# Shows what the app's live sources return, from GitHub's network.
on:
  push:
    paths: [tools/site_probe.py, .github/workflows/site-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/site_probe.py
