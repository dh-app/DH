name: Catalogue

# Builds library/catalog.json, the one file the app downloads: flyers copied from
# the website (or the Internet Archive when it is down), flyers uploaded to
# library/flyers/<Language>/, and the YouTube playlists. See library/README.md.
on:
  schedule:
    - cron: "23 1 * * *"   # daily, 06:53 in India
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "library/flyers/**"
      - "!library/flyers/_generated/**"
      - "!library/flyers/_from-website/**"
      - "mobile_app/NabiUrRahmahApp/catalog-builder/**"
      - "mobile_app/NabiUrRahmahApp/app/src/main/kotlin/org/darulhuda/nabiurrahmah/data/**"
      - "mobile_app/NabiUrRahmahApp/gradle.properties"
      - ".github/workflows/catalog.yml"

permissions:
  contents: write

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish the catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build catalogue
        working-directory: mobile_app/NabiUrRahmahApp
        run: ./gradlew :catalog-builder:run

      - name: Publish
        run: |
          git config user.name "Nabi ur Rahmah catalogue"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "Update catalogue"
          git pull -q --rebase
          git push -q
