org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The page the app reads flyers from. Language pages linked from it are read too.
nur.siteUrl=https://darulhudaudupi.org/nabi-ur-rahmah/

# YouTube playlists shown under Videos, comma separated. Playlists linked or
# embedded on the website page above are added automatically.
nur.youtubePlaylists=PLcF_nL7kXdt2VWfAg3XkhXaOEjH5KYviq,PLcF_nL7kXdt0udlvCNfprkl5r0upR9iir

# Book shelves on the home screen. Each is a comma-separated list of sources:
#   islamhouse:<category id>   an IslamHouse category, in every language
#   page:<https url>           every PDF linked from that web page
# An empty shelf shows "coming soon".
nur.shelf.biography=islamhouse:795
nur.shelf.testimonies=
nur.shelf.books=
