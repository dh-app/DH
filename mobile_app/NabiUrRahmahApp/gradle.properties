org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Nabi ur Rahmah page flyers are read from, then the language pages it links to.
# Several addresses may be listed (comma separated); the first that works is used.
nur.siteUrl=https://darulhudaudupi.org/nabi-ur-rahmah%EF%B7%BA/,https://darulhudaudupi.org/nabi-ur-rahmah/

# Where the daily catalogue build (.github/workflows/catalog.yml) publishes
# library/catalog.json and the flyer copies. The app reads this first.
nur.publishedBase=https://raw.githubusercontent.com/dh-app/DH/main/library/

# YouTube playlists shown under Videos, comma separated. Playlists linked or
# embedded on the website page above are added automatically.
nur.youtubePlaylists=PLcF_nL7kXdt2VWfAg3XkhXaOEjH5KYviq,PLcF_nL7kXdt0udlvCNfprkl5r0upR9iir

# Book shelves on the home screen. Each is a comma-separated list of sources:
#   islamhouse:<category id>   an IslamHouse category, in every language
#   page:<https url>           every PDF linked from that web page
#   github:<owner/repo>@<tag>  every PDF attached to that GitHub release
#   repo:<owner/repo>@<branch>[/<folder>]  every PDF in that repository folder
#                              (titles and authors from "Book Name:/Author:" .txt notes)
# A shelf with no books yet shows "coming soon".
nur.shelf.biography=repo:dh-app/DH@main/library/prophetic-biography,github:dh-app/DH@prophetic-biography,islamhouse:795
nur.shelf.testimonies=repo:dh-app/DH@main/library/what-they-say,github:dh-app/DH@what-they-say
nur.shelf.books=repo:dh-app/DH@main/library/books-on-prophet,github:dh-app/DH@books-on-prophet
